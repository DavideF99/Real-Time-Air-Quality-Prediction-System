# Pytest Configuration for Air Quality Predictor
# 
# Run tests:
#   pytest                          # Run all tests
#   pytest -v                       # Verbose output
#   pytest -m unit                  # Only unit tests
#   pytest -m integration           # Only integration tests
#   pytest --cov=src               # With coverage report
#   pytest -n auto                  # Parallel execution

[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum Python version
minversion = 7.0

# Command line options (always applied)
addopts = 
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Strict config (fail on config issues)
    --strict-config
    # Show warnings
    -W default
    # Coverage (commented out by default - enable when needed)
    # --cov=src
    # --cov-report=html
    # --cov-report=term-missing
    # Parallel execution (commented out - enable for speed)
    # -n auto

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated component tests)
    integration: Integration tests (test component interactions)
    api: API endpoint tests (requires running API)
    performance: Performance and load tests
    slow: Tests that take a long time to run
    smoke: Critical tests that must pass (subset for CI)
    data: Tests that require real data files
    models: Tests that require trained models
    
# Timeout for tests (prevents hanging)
timeout = 300
timeout_method = thread

# Ignore warnings from specific modules
filterwarnings =
    ignore::DeprecationWarning:sklearn.*
    ignore::FutureWarning:pandas.*
    ignore::UserWarning:matplotlib.*

# Log output configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# File logging
log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Console output
console_output_style = progress

# Coverage configuration
[coverage:run]
source = src
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
skip_empty = true
skip_covered = false
show_missing = true
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov